<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>LexiCard - Hệ thống học từ vựng IELTS</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        @layer base {

            html,
            body {
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior: none;
            }

            main> :first-child {
                margin-top: 0 !important;
            }

            main> :last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-fixed": "#6ffbbe", "on-secondary-fixed-variant": "#005236", "primary": "#3525cd", "on-error": "#ffffff", "on-surface-variant": "#464555", "primary-fixed": "#e2dfff", "outline-variant": "#c7c4d8", "secondary-container": "#6cf8bb", "on-tertiary-container": "#ffd4a4", "surface-container-lowest": "#ffffff", "surface-container-high": "#dce9ff", "tertiary-container": "#885500", "on-secondary": "#ffffff", "tertiary": "#684000", "inverse-on-surface": "#eaf1ff", "on-primary-container": "#dad7ff", "surface-container": "#e5eeff", "primary-container": "#4f46e5", "error-container": "#ffdad6", "surface-variant": "#d3e4fe", "tertiary-fixed": "#ffddb8", "on-tertiary-fixed": "#2a1700", "surface-dim": "#cbdbf5", "on-primary-fixed": "#0f0069", "on-error-container": "#93000a", "background": "#f8f9ff", "primary-fixed-dim": "#c3c0ff", "inverse-primary": "#c3c0ff", "surface-container-low": "#eff4ff", "surface": "#f8f9ff", "error": "#ba1a1a", "on-surface": "#0b1c30", "surface-tint": "#4d44e3", "surface-container-highest": "#d3e4fe", "on-secondary-fixed": "#002113", "inverse-surface": "#213145", "secondary-fixed-dim": "#4edea3", "on-primary-fixed-variant": "#3323cc", "outline": "#777587", "on-tertiary-fixed-variant": "#653e00", "tertiary-fixed-dim": "#ffb95f", "surface-bright": "#f8f9ff", "secondary": "#006c49", "on-primary": "#ffffff", "on-background": "#0b1c30", "on-tertiary": "#ffffff", "on-secondary-container": "#00714d" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xxs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem", "space-2xl": "3rem", "space-md": "1rem", "gutter-mobile": "1rem", "max-app-width": "72rem", "space-xs": "0.5rem", "space-3xl": "4rem", "space-sm": "0.75rem", "max-card-width": "36rem", "gutter-desktop": "1.5rem" }, "fontFamily": { "body-sm": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-hero": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "phonetic-display": ["Plus Jakarta Sans"], "label-caps": ["Plus Jakarta Sans"] } } } };
    </script>
</head>

<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header
        class="fixed top-0 left-0 right-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(15,23,42,0.05)]">
        <div
            class="h-16 max-w-max-app-width mx-auto px-gutter-mobile lg:px-gutter-desktop flex items-center justify-between gap-space-md">

            <div class="flex items-center gap-space-md min-w-0">
                <div class="flex items-center gap-space-xs flex-shrink-0">
                    <span
                        class="font-headline-sm text-primary font-bold tracking-tight hidden sm:inline">LexiCard</span>
                </div>
                <div class="h-4 w-px bg-outline-variant hidden xl:block"></div>
                <!-- Tabs -->
                <div id="mode-tabs"
                    class="hidden flex bg-surface-container-low p-1 rounded-lg overflow-x-auto hide-scroll">
                    <button data-mode="flashcard"
                        class="tab-btn active px-3 py-1.5 rounded-md font-label-md text-primary bg-surface-container-lowest shadow-sm transition-all whitespace-nowrap">Học
                        thẻ</button>
                    <button data-mode="listening"
                        class="tab-btn px-3 py-1.5 rounded-md font-label-md text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">Nghe
                        chọn</button>
                    <button data-mode="dictation"
                        class="tab-btn px-3 py-1.5 rounded-md font-label-md text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">Nghe
                        & Gõ</button>
                    <button data-mode="recall"
                        class="tab-btn px-3 py-1.5 rounded-md font-label-md text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">Đoán
                        từ</button>
                    <button data-mode="recall-typing"
                        class="tab-btn px-3 py-1.5 rounded-md font-label-md text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">Gõ
                        từ</button>
                    <button data-mode="match"
                        class="tab-btn px-3 py-1.5 rounded-md font-label-md text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">Nối
                        từ</button>
                </div>
            </div>

            <!-- Công cụ (Sheet, Upload, Cài đặt) -->
            <div class="flex items-center gap-space-sm flex-shrink-0">
                <select id="sheet-select"
                    class="hidden max-w-[140px] sm:max-w-[200px] truncate bg-surface-container-lowest border border-outline-variant/30 text-on-surface font-label-md rounded-lg focus:ring-primary outline-none px-3 py-1.5 cursor-pointer shadow-sm"></select>

                <input type="file" id="csv-input" accept=".csv, .xlsx, .xls" class="hidden" />
                <label for="csv-input"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-primary-fixed/50 hover:bg-primary-fixed text-primary font-label-md cursor-pointer transition-colors border border-primary/20">
                    <span class="material-symbols-outlined text-[18px]">upload_file</span><span
                        class="hidden sm:inline">Tải Dữ Liệu</span>
                </label>

                <button id="btn-open-settings"
                    class="p-2 rounded-lg text-outline-variant hover:text-on-surface hover:bg-surface-container-low transition-colors"
                    title="Cài đặt">
                    <span class="material-symbols-outlined text-[24px]">settings</span>
                </button>
            </div>
        </div>
    </header>

    <!-- KHUNG CHỨA COMPONENT (Mọi Module JS sẽ bơm HTML vào đây) -->
    <main id="app-root" class="w-full pt-16 flex-1 bg-background flex flex-col justify-center"></main>

    <!-- FOOTER -->
    <footer class="w-full bg-surface-container-lowest border-t border-outline-variant/30 py-space-sm mt-auto z-10">
        <div
            class="max-w-[760px] mx-auto px-gutter-desktop flex items-center justify-center text-on-surface-variant font-label-md">
            <div>© 2026 LexiCard • Hệ thống Học Component-based</div>
        </div>
    </footer>

    <!-- MODAL CÀI ĐẶT -->
    <div id="settings-modal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 transition-opacity">
        <div
            class="bg-surface-container-lowest w-full max-w-sm rounded-2xl shadow-xl overflow-hidden animate-fadeIn max-h-[90vh] overflow-y-auto hide-scroll">
            <div class="flex items-center justify-between p-4 border-b border-outline-variant/30">
                <h3 class="font-headline-sm font-bold text-on-surface">Cài đặt luyện tập</h3>
                <button id="btn-close-settings"
                    class="p-1 rounded-full text-outline-variant hover:text-error hover:bg-error-container/50 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="p-6 flex flex-col gap-5">
                <!-- 1. Auto-next -->
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-label-lg font-bold text-on-surface">Tự động chuyển câu</div>
                        <div class="font-body-sm text-on-surface-variant">Tự chuyển sang câu mới khi đúng.</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                        <input type="checkbox" id="toggle-autonext" class="sr-only peer">
                        <div
                            class="w-11 h-6 bg-outline-variant/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                        </div>
                    </label>
                </div>

                <div class="flex items-center justify-between pl-4 border-l-2 border-outline-variant/30 transition-opacity"
                    id="box-autonext-delay">
                    <div class="font-label-md font-semibold text-on-surface-variant">Thời gian chờ:</div>
                    <select id="select-autonext-delay"
                        class="bg-surface-container-low border border-outline-variant/30 text-on-surface font-label-md rounded-lg focus:ring-primary outline-none px-2 py-1.5 cursor-pointer shadow-sm">
                        <option value="1000">1.0 giây (Nhanh)</option>
                        <option value="1500">1.5 giây (Chuẩn)</option>
                        <option value="2000">2.0 giây (Chậm)</option>
                        <option value="3000">3.0 giây (Rất chậm)</option>
                    </select>
                </div>

                <hr class="border-outline-variant/20">

                <!-- 2. Gợi ý Nghe & Gõ -->
                <div>
                    <div class="font-label-lg font-bold text-on-surface mb-1">Chế độ Nghe & Gõ</div>
                    <div class="font-body-sm text-on-surface-variant mb-3">Tự động hiển thị sau khi nộp đáp án:</div>

                    <div class="flex flex-col gap-3 pl-4 border-l-2 border-outline-variant/30">
                        <div class="flex items-center justify-between">
                            <div class="font-label-md font-semibold text-on-surface-variant">Hiện Phiên âm (IPA)</div>
                            <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                                <input type="checkbox" id="toggle-autoshow-ipa" class="sr-only peer">
                                <div
                                    class="w-9 h-5 bg-outline-variant/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="font-label-md font-semibold text-on-surface-variant">Hiện Nghĩa Tiếng Việt</div>
                            <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                                <input type="checkbox" id="toggle-autoshow-vi" class="sr-only peer">
                                <div
                                    class="w-9 h-5 bg-outline-variant/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <hr class="border-outline-variant/20">

                <!-- 3. Quản lý Dữ liệu -->
                <div class="flex flex-col gap-3">
                    <!-- Nút 1: Reset Tiến độ -->
                    <div>
                        <div class="font-label-lg font-bold text-on-surface">Đặt lại tiến độ</div>
                        <button id="btn-reset-progress"
                            class="w-full py-2.5 mt-1 rounded-lg bg-surface-container-high text-on-surface font-label-md font-bold hover:bg-outline-variant transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-[18px]">refresh</span> Học lại từ đầu
                        </button>
                    </div>

                    <!-- Nút 2: Xóa File -->
                    <div>
                        <div class="font-label-lg font-bold text-error">Xóa Dữ liệu</div>
                        <button id="btn-clear-data"
                            class="w-full py-2.5 mt-1 rounded-lg bg-error-container/50 text-error font-label-md font-bold hover:bg-error hover:text-on-error transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-[18px]">delete_forever</span> Xóa File khỏi bộ
                            nhớ
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- THƯ VIỆN LƯU TRỮ DỮ LIỆU VÀO INDEXED DB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <!-- THƯ VIỆN SHEETJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- KHỞI CHẠY JAVASCRIPT -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
